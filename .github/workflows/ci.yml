name: Build and test
# Actions minutes: a PR commit used to run twice (push + pull_request) on both OSes, and Windows minutes count double.
# Now: pull_request -> Linux only; push to main and manual dispatch -> Linux and Windows.
# Run Windows on a branch before merge with: gh workflow run ci.yml --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      # Report Linux and Windows independently; a failure on one OS must not cancel the other.
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run publish:check
