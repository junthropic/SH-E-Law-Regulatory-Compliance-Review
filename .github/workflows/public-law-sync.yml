name: Weekly public law update
on:
  schedule:
    # Every Friday 18:00 EST (UTC-5) = Friday 23:00 UTC = Saturday 08:00 Asia/Seoul. Cron is UTC and does not follow
    # US daylight time: while EDT is in effect this is 19:00 New York time. GitHub schedules may be delayed.
    - cron: "0 23 * * 5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-law-update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch official public sources
        id: sync
        continue-on-error: true
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: npm run sync
      - name: Validate public-only output
        run: npm run publish:check
      - name: Save public snapshots and source status
        shell: bash
        run: |
          git add -- data/public
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "data: refresh public law snapshots"
            # Collection may take long enough for the application code to change.
            # Rebase the data-only commit; a real content conflict still fails.
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Surface incomplete collection
        if: steps.sync.outcome != 'success'
        run: exit 1
