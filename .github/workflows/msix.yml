name: MSIX package and install test
# v8 stage 4. Not part of PR/main CI (Windows minutes count double). Run it by pushing a branch to msix-test/<name>
# (git push origin HEAD:msix-test/<name>), or manually once this file is on main: gh workflow run msix.yml --ref <branch>
# Clean Windows runner: build a test-signed MSIX and the unsigned Store MSIX -> package scan -> install/run/backup/uninstall/reinstall/restore -> WACK.
# The test certificate (private key) is created in RUNNER_TEMP and never uploaded.
on:
  workflow_dispatch:
  push:
    branches: ["msix-test/**"]
permissions:
  contents: read
jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # F-13: the node.exe that will be packaged must match the official SHASUMS256.txt of its exact version. This is the
      # only download for the check; the build script reads the saved list, checks again and records the hash.
      - name: Verify node.exe against the official SHASUMS256
        run: |
          $version = node -p "process.version"
          $arch = node -p "process.arch"
          $exe = node -p "process.execPath"
          Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/$version/SHASUMS256.txt" -OutFile "$env:RUNNER_TEMP\node-SHASUMS256.txt"
          $line = Select-String -CaseSensitive -Path "$env:RUNNER_TEMP\node-SHASUMS256.txt" -Pattern "^([0-9a-f]{64})  win-$arch/node\.exe$"
          if (@($line).Count -ne 1) { Write-Output "win-$arch/node.exe is not listed once in SHASUMS256.txt of $version"; exit 1 }
          $expected = $line.Matches[0].Groups[1].Value
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          Write-Output "node $version win-$arch/node.exe sha256 $actual"
          if ($actual -ne $expected) { Write-Output "node.exe does not match SHASUMS256.txt (expected $expected)"; exit 1 }
      - name: Build test-signed MSIX
        run: node scripts/build-msix-v8.mjs --test-identity --sign-test --out "$env:RUNNER_TEMP\msix" --cert-dir "$env:RUNNER_TEMP\cert" --node-shasums "$env:RUNNER_TEMP\node-SHASUMS256.txt"
      - name: Build Store MSIX (unsigned; the Store signs it)
        run: node scripts/build-msix-v8.mjs --store --skip-build --out "$env:RUNNER_TEMP\msix-store" --node-shasums "$env:RUNNER_TEMP\node-SHASUMS256.txt"
      - name: Package scan
        id: scan
        continue-on-error: true
        # Names to look for come from the repository secret SHE_SCAN_NAMES (comma separated); never from the repository.
        env:
          SHE_SCAN_NAMES: ${{ secrets.SHE_SCAN_NAMES }}
        run: |
          $failed = $false
          foreach ($p in @("$env:RUNNER_TEMP\msix\SHELaw-Beta_0.8.3.0_x64_test.msix", "$env:RUNNER_TEMP\msix-store\SHELaw-Beta_0.8.3.0_x64_store.msix")) {
            $name = [IO.Path]::GetFileNameWithoutExtension($p)
            node scripts/package-scan.mjs $p --package --write-allow "$env:RUNNER_TEMP\msix\$name-scan-draft.json" --allow packaging/msix/scan-exceptions.json --json "$env:RUNNER_TEMP\msix\$name-scan.json"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            # New or changed findings are never accepted automatically: list them (file, kind, count; no values) for the user.
            if (Test-Path "$env:RUNNER_TEMP\msix\$name-scan.json") {
              $r = Get-Content "$env:RUNNER_TEMP\msix\$name-scan.json" -Raw | ConvertFrom-Json
              "### ${name}: blocking $($r.summary.total), accepted $($r.accepted.total)" | Add-Content $env:GITHUB_STEP_SUMMARY
              foreach ($f in $r.summary.byFile.PSObject.Properties) { "- $($f.Name): $(($f.Value | ConvertTo-Json -Compress))" | Add-Content $env:GITHUB_STEP_SUMMARY }
            }
          }
          if ($failed) { exit 1 }
      - name: Install test
        id: install
        continue-on-error: true
        shell: powershell
        run: .\scripts\msix-install-test-v8.ps1 -Msix "$env:RUNNER_TEMP\msix\SHELaw-Beta_0.8.3.0_x64_test.msix" -Cer "$env:RUNNER_TEMP\cert\test-signing.cer" -Out "$env:RUNNER_TEMP\result"
      - name: Windows App Certification Kit
        id: wack
        continue-on-error: true
        shell: powershell
        run: |
          $kit = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $kit)) { Write-Output "appcert.exe not found on this runner"; exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\result" | Out-Null
          (Get-Item $kit).VersionInfo.FileVersion | Out-File "$env:RUNNER_TEMP\result\wack-version.txt"
          & $kit reset
          & $kit test -appxpackagepath "$env:RUNNER_TEMP\msix\SHELaw-Beta_0.8.3.0_x64_test.msix" -reportoutputpath "$env:RUNNER_TEMP\result\wack.xml"
          if (-not (Test-Path "$env:RUNNER_TEMP\result\wack.xml")) { exit 1 }
          $report = [xml](Get-Content "$env:RUNNER_TEMP\result\wack.xml" -Raw)
          $tests = @($report.SelectNodes("//TEST") | ForEach-Object { [ordered]@{ index = $_.INDEX; name = $_.NAME; optional = ($_.OPTIONAL -eq "TRUE"); result = $_.RESULT.InnerText } })
          $summary = [ordered]@{ overall = $report.REPORT.OVERALL_RESULT; tests = $tests }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\result\wack-summary.json", ($summary | ConvertTo-Json -Depth 4), (New-Object Text.UTF8Encoding($false)))
          Write-Output "WACK overall: $($summary.overall)"
          $tests | Where-Object { $_.result -ne "PASS" } | ForEach-Object { Write-Output ("{0} {1} optional={2}" -f $_.result, $_.name, $_.optional) }
          # Required (non-optional) tests must pass; optional results are recorded and reported.
          if (@($tests | Where-Object { -not $_.optional -and $_.result -ne "PASS" }).Count -gt 0) { exit 1 }
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-results
          retention-days: 14
          path: |
            ${{ runner.temp }}/msix/*.msix
            ${{ runner.temp }}/msix/msix-build.json
            ${{ runner.temp }}/msix/*-scan.json
            ${{ runner.temp }}/msix/*-scan-draft.json
            ${{ runner.temp }}/msix-store/*.msix
            ${{ runner.temp }}/msix-store/msix-build.json
            ${{ runner.temp }}/result/install-test.json
            ${{ runner.temp }}/result/wack.xml
            ${{ runner.temp }}/result/wack-summary.json
            ${{ runner.temp }}/result/wack-version.txt
      - name: Fail if a check failed
        if: steps.scan.outcome != 'success' || steps.install.outcome != 'success' || steps.wack.outcome != 'success'
        run: |
          Write-Output "scan=${{ steps.scan.outcome }} install=${{ steps.install.outcome }} wack=${{ steps.wack.outcome }}"
          exit 1
